name: Tests RLS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rls:
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: supabase/setup-cli@v1
        with:
          # PIN de versión: evita la llamada «resolver la última release» a la API de
          # GitHub, que sin token se rate-limitea (60 req/h por IP compartida entre runners)
          # y hacía fallar setup-cli con «supabase: command not found». El token ayuda a la
          # descarga de esa release fija.
          version: 2.109.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Arrancamos SIN migraciones y luego las aplicamos con psql en autocommit
      # (una sentencia = una transacción). Así `alter type ... add value` queda
      # confirmado antes de usarse, evitando el error 55P04 "unsafe use of new
      # value" que da la CLI al aplicar cada migración dentro de una transacción.
      - name: Levantar Supabase local (sin migraciones)
        run: |
          mkdir -p /tmp/migs
          mv supabase/migrations/*.sql /tmp/migs/
          supabase start

      - name: Aplicar migraciones por sentencia (autocommit, enum-safe)
        run: |
          for f in $(ls /tmp/migs/*.sql | sort); do
            echo "== Aplicando $(basename "$f") =="
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Conceder privilegios a authenticated (como en Supabase cloud)
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "grant usage on schema public to authenticated, anon; grant all on all tables in schema public to authenticated; grant all on all sequences in schema public to authenticated; grant execute on all functions in schema public to authenticated;"

      - name: Sembrar un admin verificado para las pruebas
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into auth.users (id, email) values ('00000000-0000-0000-0000-0000000000aa', 'admin@test.local');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "update public.perfiles set rol='admin', verificado=true where id='00000000-0000-0000-0000-0000000000aa';"

      - name: Ejecutar pruebas de RLS
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/verificar_rls.sql

      # Hilos de trabajo (0231): la semilla es autónoma y las pruebas terminan lanzando
      # una excepción si alguna falló, así que ON_ERROR_STOP basta para poner CI en rojo.
      - name: Ejecutar pruebas de hilos (0231)
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/semilla_hilos_0231.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pruebas_hilos_0231.sql

      # Intake sensible fuera de `perfiles` (0232) + contador de sin leer (0233).
      # Reutiliza la semilla de 0231, que ya está sembrada por el paso anterior.
      - name: Ejecutar pruebas de intake y contador (0232/0233)
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pruebas_intake_0232.sql

      # Idempotencia: se reaplican las migraciones con la base YA POBLADA, que es el caso
      # difícil (constraints sobre filas existentes, policies con datos detrás). Se leen
      # de /tmp/migs porque el paso de arranque saca las migraciones del árbol; intentarlo
      # desde supabase/migrations dentro del propio .sql de pruebas era un falso verde,
      # ya que psql no se detiene ante un \i que no encuentra el fichero.
      - name: Comprobar idempotencia de 0231-0233
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/migs/0231_hilos_de_trabajo.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/migs/0232_intake_sensible_fuera_de_perfiles.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/migs/0233_hilos_sin_leer.sql

      - name: Apagar Supabase
        if: always()
        run: supabase stop
